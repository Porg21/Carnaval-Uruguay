<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#100e18"><title>Carnaval Uruguay Manager</title><style>
:root{--b:#0d0b12;--p:#17131f;--p2:#211b2d;--l:#332b41;--t:#f7f2ff;--m:#aaa1b8;--g:#f4c454;--v:#805cff;--ok:#68d8a2;--bad:#ff7b83}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#211638 0,#0d0b12 35%);color:var(--t);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}.wrap{max-width:1100px;margin:auto;padding:16px 14px 90px}.top{position:sticky;top:0;z-index:9;background:#0d0b12e8;backdrop-filter:blur(14px);border-bottom:1px solid var(--l)}.top>div{max-width:1100px;margin:auto;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--v),#b54fff)}small,.muted{color:var(--m)}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800;background:var(--g);color:#1b1509;cursor:pointer}.btn.alt{background:var(--p2);color:var(--t);border:1px solid var(--l)}.btn.red{background:#3b1d24;color:#ffc0c4}.hero,.card{background:#17131fe8;border:1px solid var(--l);border-radius:18px;padding:16px}.hero{background:linear-gradient(145deg,#251a3c,#1a1720);box-shadow:0 16px 50px #0005}.hero h1,.card h3{margin:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.full{grid-column:1/-1}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.stat{background:#100e16;border:1px solid var(--l);border-radius:12px;padding:10px}.stat span{display:block;color:var(--m);font-size:.7rem}.stat b{display:block;margin-top:3px}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.nav button{border:1px solid var(--l);background:var(--p);color:var(--m);padding:8px 10px;border-radius:10px;font-weight:750}.nav button.on{background:var(--g);color:#1b1509}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#100e16;border:1px solid var(--l);border-radius:12px;padding:10px;margin-top:8px}.row b{display:block}.row small{display:block;margin-top:3px;line-height:1.35}.rating{min-width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;background:#153224;color:#a8f1ca}.rating.mid{background:#382f17;color:#ffe5a5}.rating.low{background:#3b1d24;color:#ffc2c6}.bar{height:8px;background:#0b0910;border-radius:999px;overflow:hidden;margin:5px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--g))}.pill{display:inline-block;font-size:.66rem;padding:4px 7px;border-radius:999px;background:var(--p2);margin:4px 4px 0 0}.week{display:grid;grid-template-columns:repeat(7,minmax(105px,1fr));gap:7px;overflow-x:auto}.day{min-width:105px;min-height:125px;background:#100e16;border:1px solid var(--l);border-radius:12px;padding:8px}.chip{font-size:.67rem;padding:6px;border-radius:8px;background:#2a1f46;margin:7px 0}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{border:1px solid var(--l);background:var(--p2);color:var(--m);border-radius:999px;padding:6px 9px}.tabs button.on{background:var(--g);color:#111}.modalbg{position:fixed;inset:0;z-index:20;background:#000b;display:grid;place-items:center;padding:14px}.modal{width:min(590px,100%);max-height:90vh;overflow:auto;background:#17131f;border:1px solid var(--l);border-radius:18px;padding:16px}.parts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.parts button{border:1px solid var(--l);background:var(--p2);color:var(--t);border-radius:9px;padding:7px}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:.72rem;color:var(--m)}.field input{width:100%;background:#0e0c13;color:var(--t);border:1px solid var(--l);border-radius:9px;padding:9px}.setup{max-width:850px;margin:35px auto;padding:14px}.setup .hero{text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px}.choice{text-align:left;background:#100e16;color:var(--t);border:1px solid var(--l);border-radius:14px;padding:13px;cursor:pointer}.choice.on{border-color:var(--g);box-shadow:0 0 0 2px #f4c45422}.choice small{display:block;margin-top:5px}.note{background:#102130;border:1px solid #23415d;color:#cae8ff;padding:10px;border-radius:10px;font-size:.78rem;line-height:1.4}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:9px;border-bottom:1px solid var(--l);text-align:left;font-size:.76rem}th{color:var(--m)}.scroll{overflow:auto}@media(max-width:750px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:repeat(2,1fr)}.choices{grid-template-columns:1fr}.wrap{padding:12px 12px 90px}}
</style></head><body><div id="app"></div><script>
'use strict';const K='carnaval_uy_v01',APP=document.getElementById('app');
const CAT={Murga:{i:'🎭',n:22,l:10},Parodistas:{i:'🎬',n:6,l:4},Humoristas:{i:'😂',n:5,l:3},Revista:{i:'💃',n:5,l:3},Lubolos:{i:'🥁',n:6,l:4}};
const DIF={'Desde abajo':220000,Equilibrado:480000,Libre:1100000},RUB=['Voces / Musicalidad','Textos / Interpretación','Puesta en escena','Coreografía / Bailes','Vestuario / Maquillaje','Rodaje general'],PART=[...RUB.slice(0,4),'Ensayo completo'],MON=['Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre','Enero'],DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const FN=['Agustín','Valentina','Martín','Lucía','Bruno','Camila','Santiago','Florencia','Nicolás','Sofía','Mateo','Martina','Joaquín','Micaela','Facundo','Julieta','Emiliano','Clara','Thiago','Renata','Franco','Agustina','Sebastián','Victoria'],LN=['Silva','Pereira','Rodríguez','Gómez','Fernández','Suárez','Acosta','Sosa','Cabrera','Martínez','Viera','Méndez','López','Ramos','Cardozo','Olivera'];
const ROLES={Murga:['Segundo','Primo','Sobreprimo','Bombo','Platillos','Redoblante'],Parodistas:['Actor-cantante','Actor','Cantante','Bailarín / Actor'],Humoristas:['Humorista / Actor','Actor-cantante','Cantante'],Revista:['Bailarín','Cantante','Actor','Bailarín / Cantante'],Lubolos:['Tamborilero','Bailarina','Vedette','Escobero','Gramillero','Mama Vieja','Portabandera']};
const NAMES={Murga:['La Contracara','Los Desvelados','Falta Una Noche','La Farola','Los del Andén','La Vuelta Entera','Contramano Sur','La Madrugada','Salpicón','Los Vecinos','La Bohemia','La Esquina','A Contraluz','Los Inquietos','La Banda Nueva','De Rebote','La Compañera','La Penúltima','Calle Adentro','La Resaca','Los del Fondo','La Trasnochada'],Parodistas:['Los Galantes','Cabaret Oriental','Los del Telón','Parodia Sur','Los Viajeros','La Compañía'],Humoristas:['Los Reidores','La Otra Mitad','Los Improvisados','Humor de Barrio','Los de Siempre'],Revista:['Brillo Oriental','Fantasía Sur','Nueva Estrella','Magnolia','Luz de Carnaval'],Lubolos:['Raíz Morena','Candombe Sur','La Estirpe','Barrio Tambor','Alma Negra','Herencia']};
let S=JSON.parse(localStorage.getItem(K)||'null'),U={view:'Inicio',step:0,setup:{name:'',cat:'',dif:'',first:''},modal:null,filter:'Todos'};
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,ch=a=>a[Math.floor(Math.random()*a.length)],cl=(n,a,b)=>Math.max(a,Math.min(b,n)),avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,money=n=>new Intl.NumberFormat('es-UY',{style:'currency',currency:'UYU',maximumFractionDigits:0}).format(Math.round(n)),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>localStorage.setItem(K,JSON.stringify(S));
function artist(cat,free=true,young=false){let role=ch(ROLES[cat]),age=young?18:rand(19,52),base=rand(young?47:38,young?78:78),attrs={Canto:cl(base+rand(-14,14),15,99),Actuación:cl(base+rand(-13,15),15,99),Presencia:cl(base+rand(-10,15),20,99),Profesionalismo:cl(base+rand(-7,18),20,99),Popularidad:cl(base+rand(-18,12),8,99)};if(/Bombo|Platillos|Redoblante|Tambor/.test(role))attrs.Percusión=cl(base+rand(2,18),20,99);if(/Bail|Vedette|Escobero|Mama|Gramillero/.test(role))attrs.Baile=cl(base+rand(0,18),20,99);if(/Humor/.test(role))attrs.Comicidad=cl(base+rand(1,18),20,99);let exp=young?0:cl((age-18)*2+rand(-8,16),3,92),rating=Math.round(avg(Object.values(attrs))*.88+exp*.12);return{id:crypto.randomUUID(),name:ch(FN)+' '+ch(LN),age,cat,role,attrs,exp,rating,potential:rand(Math.max(55,rating+5),99),known:!young,status:free?'Libre':'Plantel',salary:null}}
function rivals(){let x={};Object.keys(CAT).forEach(c=>x[c]=NAMES[c].map(n=>({name:n,prestige:rand(25,90),pop:rand(20,90),money:rand(180000,1200000),style:ch(['Apuesta por jóvenes','Busca figuras','Austero','Equilibrado','Gastador'])})));return x}
function roster(c){let n=c==='Murga'?16:c==='Parodistas'?17:c==='Humoristas'?14:c==='Revista'?20:27;return Array.from({length:n},()=>artist(c,false,false)).map(a=>(a.rating=rand(38,58),a))}
function market(){let a=[];Object.keys(CAT).forEach(c=>{for(let i=0;i<14;i++)a.push(artist(c,true,i<2))});return a}
function newGame(){let r=rivals(),weak=[...r[U.setup.cat]].sort((a,b)=>a.prestige-b.prestige).slice(0,4),rep=ch(weak);return{year:2027,cal:{m:0,w:1,g:1},p:{name:U.setup.name,cat:U.setup.cat,dif:U.setup.dif,first:U.setup.first,money:DIF[U.setup.dif],prestige:18,pop:14,replaced:rep.name,roster:roster(U.setup.cat),rub:Object.fromEntries(RUB.map((r,i)=>[r,[42,40,38,36,39,31][i]])),neg:{},plan:{}},rivals:r,market:market(),news:[`${U.setup.name} inicia su temporada en ${U.setup.cat}, reemplazando a ${rep.name}.`],fest:[],done:false}}
function rating(){let p=S.p,rr=avg(p.roster.map(a=>a.rating)),w={};RUB.forEach(r=>w[r]=1);if(p.cat==='Murga'){w['Textos / Interpretación']=4;w['Voces / Musicalidad']=2}if(p.cat==='Humoristas')w['Textos / Interpretación']=4;if(p.cat==='Parodistas'){w['Voces / Musicalidad']=3;w['Puesta en escena']=2}if(p.cat==='Revista'){w['Coreografía / Bailes']=3;w['Voces / Musicalidad']=2}if(p.cat==='Lubolos'){w['Textos / Interpretación']=3;w['Voces / Musicalidad']=2}let sw=0,st=0;RUB.forEach(r=>{sw+=p.rub[r]*w[r];st+=w[r]});return Math.round(rr*.35+(sw/st)*.55+38*.1)}
function render(){S?game():setup()}
function setup(){let s=U.setup,body='';if(U.step===0)body=`<h2>Creá tu conjunto</h2><div class=field><label>Nombre</label><input id=nm value="${esc(s.name)}" placeholder="Ej.: La Nueva Noche"></div>`;if(U.step===1)body=`<h2>Elegí categoría</h2><div class=choices>${Object.entries(CAT).map(([n,c])=>`<button class="choice ${s.cat===n?'on':''}" data-cat="${n}"><b>${c.i} ${n}</b><small>${c.n} conjuntos · ${c.l} pasan a Liguilla.</small></button>`).join('')}</div>`;if(U.step===2)body=`<h2>Economía inicial</h2><div class=choices>${Object.entries(DIF).map(([n,v])=>`<button class="choice ${s.dif===n?'on':''}" data-dif="${n}"><b>${n}</b><small>${money(v)}. El plantel siempre empieza flojo.</small></button>`).join('')}</div>`;if(U.step===3)body=`<h2>Primera temporada</h2><div class=choices>${['Dar Prueba de Admisión','Directo al Carnaval'].map(n=>`<button class="choice ${s.first===n?'on':''}" data-first="${n}"><b>${n}</b><small>${n.startsWith('Dar')?'En noviembre disputarás la prueba de 20 minutos.':'Tenés lugar asegurado en febrero el primer año.'}</small></button>`).join('')}</div>`;APP.innerHTML=`<div class=setup><div class=hero><div class=logo style="margin:auto">🎭</div><h1>Carnaval Uruguay</h1><p class=muted>Simulador de gestión · v0.1</p></div><div class=card style="margin-top:12px;text-align:left">${body}<div style="display:flex;justify-content:space-between;margin-top:15px"><button class="btn alt" id=back ${U.step?'' :'disabled'}>Atrás</button><button class=btn id=next>${U.step===3?'Comenzar':'Continuar'}</button></div></div></div>`;document.getElementById('nm')?.addEventListener('input',e=>s.name=e.target.value);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{s.cat=b.dataset.cat;render()});document.querySelectorAll('[data-dif]').forEach(b=>b.onclick=()=>{s.dif=b.dataset.dif;render()});document.querySelectorAll('[data-first]').forEach(b=>b.onclick=()=>{s.first=b.dataset.first;render()});back.onclick=()=>{U.step--;render()};next.onclick=()=>{if(U.step===0&&!s.name.trim())return alert('Poné un nombre.');if(U.step===1&&!s.cat)return alert('Elegí categoría.');if(U.step===2&&!s.dif)return alert('Elegí economía.');if(U.step===3&&!s.first)return alert('Elegí la primera temporada.');if(U.step<3){U.step++;render()}else{S=newGame();save();render()}}}
function nav(){return ['Inicio','Plantel','Mercado','Semana','Rivales'].map(n=>`<button class="${U.view===n?'on':''}" data-v="${n}">${n}</button>`).join('')}
function game(){APP.innerHTML=`<div class=top><div><div class=brand><div class=logo>${CAT[S.p.cat].i}</div><div><b>${esc(S.p.name)}</b><small>${S.p.cat} · ${MON[S.cal.m]} semana ${S.cal.w}</small></div></div><button class="btn alt" id=sv>Guardar</button></div></div><div class=wrap><div class=nav>${nav()}</div>${view()}</div>${U.modal?modal():''}`;document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{U.view=b.dataset.v;U.modal=null;render()});sv.onclick=()=>{save();alert('Partida guardada')};bind()}
function view(){if(U.view==='Plantel')return rosterView();if(U.view==='Mercado')return marketView();if(U.view==='Semana')return weekView();if(U.view==='Rivales')return rivalsView();return home()}
function home(){return `<div class=hero><h1>${esc(S.p.name)}</h1><p class=muted>Temporada ${S.year}. Prepará el conjunto desde abril y llegá a febrero con el mejor espectáculo posible.</p><span class=pill>${S.p.dif}</span><span class=pill>${S.p.first}</span><span class=pill>Reemplazó a ${esc(S.p.replaced)}</span><div class=stats><div class=stat><span>Caja</span><b>${money(S.p.money)}</b></div><div class=stat><span>Prestigio</span><b>${S.p.prestige}/100</b></div><div class=stat><span>Popularidad</span><b>${S.p.pop}/100</b></div><div class=stat><span>Espectáculo</span><b>${rating()}/100</b></div><div class=stat><span>Plantel</span><b>${S.p.roster.length}</b></div></div></div><div class=grid><div class=card><h3>🎪 Rubros</h3>${RUB.map(r=>`<div style="display:flex;justify-content:space-between;font-size:.78rem"><span>${r}</span><b>${Math.round(S.p.rub[r])}</b></div><div class=bar><i style="width:${S.p.rub[r]}%"></i></div>`).join('')}</div><div class=card><h3>📰 Novedades</h3>${S.news.slice(-7).reverse().map(n=>`<div style="padding:8px 0;border-bottom:1px solid var(--l);font-size:.78rem">${esc(n)}</div>`).join('')}</div></div>`}
function arow(a,m=false){let rr=a.known?a.rating:`${cl(a.rating-6,1,99)}–${cl(a.rating+7,1,99)}`,attrs=Object.entries(a.attrs).slice(0,4).map(([k,v])=>`${k} ${a.known?v:'?'}`).join(' · ');return `<div class=row><div><b>${esc(a.name)} · ${a.age}</b><small>${a.cat} · ${a.role}<br>${attrs}</small><span class=pill>Exp. ${a.exp}</span>${!a.known?'<span class=pill>Atributos estimados</span>':''}</div><div style="display:flex;gap:7px;align-items:center"><div class="rating ${a.rating<60?'low':a.rating<75?'mid':''}">${rr}</div>${m?`<button class=btn data-off="${a.id}">Ofertar</button>`:`<button class="btn red" data-free="${a.id}">Libre</button>`}</div></div>`}
function rosterView(){return `<div class=hero><h1>Plantel</h1><p class=muted>Componentes de ${S.p.cat}. La valoración cambia según el rol y la experiencia.</p></div><div class=card style="margin-top:12px">${S.p.roster.map(a=>arow(a)).join('')}</div>`}
function marketView(){let roles=ROLES[S.p.cat],pool=S.market.filter(a=>a.status==='Libre'&&a.cat===S.p.cat&&(U.filter==='Todos'||a.role===U.filter));return `<div class=hero><h1>Mercado</h1><p class=muted>Sin costo de pase. Negociás directamente sueldo, actuaciones, bonos y porcentaje.</p></div><div class=card style="margin-top:12px"><div class=tabs><button class="${U.filter==='Todos'?'on':''}" data-f="Todos">Todos</button>${roles.map(r=>`<button class="${U.filter===r?'on':''}" data-f="${r}">${r}</button>`).join('')}</div>${pool.map(a=>arow(a,true)).join('')||'<p class=muted>No hay artistas.</p>'}</div>`}
function weekView(){let max=S.cal.m>=7?5:2,used=Object.values(S.p.plan).filter(x=>x.type==='ensayo').length;return `<div class=hero><h1>Planificación semanal</h1><p class=muted>${MON[S.cal.m]} · semana ${S.cal.w}. Hasta octubre: 1–2 ensayos; desde noviembre: 4–5.</p><span class=pill>Ensayos ${used}/${max}</span>${S.cal.m>=7?'<span class=pill>Ensayos abiertos: comida + merch</span>':''}${S.done?'<div class=note style="margin-top:10px">Llegaste al final jugable de la v0.1. La siguiente versión continúa con febrero día a día.</div>':''}</div><div class=card style="margin-top:12px"><div class=week>${DAYS.map((d,i)=>day(d,i,max)).join('')}</div><button class=btn id=end style="margin-top:12px" ${S.done?'disabled':''}>${S.done?'Fin de v0.1':'Cerrar semana'}</button></div><div class=card style="margin-top:12px"><h3>Regla de ensayo</h3><p class=muted>Cada ensayo tiene 3 partes. Podés repetir rubros. Ensayo completo ocupa 2. Si trabajás demasiado pocas áreas, otras se descuidan.</p></div>`}
function day(d,i,max){let e=S.p.plan[i];if(e)return `<div class=day><b>${d}</b><div class=chip>${e.type==='ensayo'?'Ensayo<br>'+e.parts.join(' · '):'Festival<br>'+esc(e.host)}</div><button class="btn alt" data-clear="${i}">Quitar</button></div>`;return `<div class=day><b>${d}</b><div style="display:grid;gap:5px;margin-top:8px"><button class="btn alt" data-ens="${i}">+ Ensayo</button><button class="btn alt" data-fest="${i}">+ Festival</button></div></div>`}
function rivalsView(){let a=[...S.rivals[S.p.cat]].sort((x,y)=>y.prestige-x.prestige);return `<div class=hero><h1>Rivales</h1><p class=muted>La IA tiene prestigio, dinero y estilo de gestión propio.</p></div><div class="card scroll" style="margin-top:12px"><table><thead><tr><th>#</th><th>Conjunto</th><th>Prestigio</th><th>Popularidad</th><th>Economía</th><th>Perfil</th></tr></thead><tbody>${a.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.name)}</td><td>${r.prestige}</td><td>${r.pop}</td><td>${r.money>850000?'Alta':r.money>420000?'Media':'Ajustada'}</td><td>${r.style}</td></tr>`).join('')}</tbody></table></div>`}
function bind(){document.querySelectorAll('[data-free]').forEach(b=>b.onclick=()=>{let a=S.p.roster.find(x=>x.id===b.dataset.free);if(confirm('¿Dejar libre a '+a.name+'?')){S.p.roster=S.p.roster.filter(x=>x.id!==a.id);a.status='Libre';S.market.push(a);S.news.push(a.name+' quedó libre.');save();render()}});document.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{U.modal={type:'offer',id:b.dataset.off};render()});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{U.filter=b.dataset.f;render()});document.querySelectorAll('[data-ens]').forEach(b=>b.onclick=()=>{let max=S.cal.m>=7?5:2,used=Object.values(S.p.plan).filter(x=>x.type==='ensayo').length;if(used>=max)return alert('Máximo de ensayos para este período.');U.modal={type:'ens',day:+b.dataset.ens,parts:[]};render()});document.querySelectorAll('[data-fest]').forEach(b=>b.onclick=()=>{S.p.plan[b.dataset.fest]={type:'festival',host:ch(NAMES[S.p.cat]),pay:rand(9000,26000),pop:rand(1,3)};save();render()});document.querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{delete S.p.plan[b.dataset.clear];save();render()});document.getElementById('end')?.addEventListener('click',endWeek)}
function modal(){if(U.modal.type==='ens'){let cap=U.modal.parts.reduce((s,p)=>s+(p==='Ensayo completo'?2:1),0);return `<div class=modalbg><div class=modal><h3>Ensayo · ${DAYS[U.modal.day]}</h3><p class=muted>Completá exactamente 3 partes.</p><div class=parts>${U.modal.parts.map((p,i)=>`<button data-rm="${i}">${p} ×</button>`).join('')}</div><div class=parts>${PART.map(p=>`<button data-add="${p}" ${cap+(p==='Ensayo completo'?2:1)>3?'disabled':''}>+ ${p}</button>`).join('')}</div><div style="display:flex;justify-content:flex-end;gap:7px;margin-top:12px"><button class="btn alt" id=cancel>Cancelar</button><button class=btn id=oks ${cap===3?'':'disabled'}>Guardar</button></div></div></div>`}let a=S.market.find(x=>x.id===U.modal.id),sug=Math.round((1800+a.rating*70)/100)*100;return `<div class=modalbg><div class=modal><h3>Negociar con ${esc(a.name)}</h3><p class=muted>${a.role} · valoración ${a.rating}. La respuesta es inmediata.</p>${[['Sueldo mensual','monthly',sug],['Por tablado/evento','show',Math.round((400+a.rating*16)/50)*50],['Por Teatro de Verano','theatre',Math.round((1500+a.rating*35)/100)*100],['Bono por Liguilla','lig',Math.round((2500+a.rating*45)/100)*100],['Bono campeón','champ',Math.round((5000+a.rating*70)/100)*100],['% ingresos febrero','pct',a.rating>78?1:0]].map(x=>`<div class=field><label>${x[0]}</label><input type=number data-o="${x[1]}" value="${x[2]}" min=0></div>`).join('')}<div style="display:flex;justify-content:flex-end;gap:7px"><button class="btn alt" id=cancel>Cancelar</button><button class=btn id=send>Enviar oferta</button></div></div></div>`}
function modalBind(){document.getElementById('cancel')?.addEventListener('click',()=>{U.modal=null;render()});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{U.modal.parts.push(b.dataset.add);render()});document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{U.modal.parts.splice(+b.dataset.rm,1);render()});document.getElementById('oks')?.addEventListener('click',()=>{S.p.plan[U.modal.day]={type:'ensayo',parts:[...U.modal.parts]};U.modal=null;save();render()});document.getElementById('send')?.addEventListener('click',()=>{let a=S.market.find(x=>x.id===U.modal.id),o={};document.querySelectorAll('[data-o]').forEach(i=>o[i.dataset.o]=+i.value||0);let val=o.monthly*8+o.show*18+o.theatre*3+o.lig*.4+o.champ*.15+o.pct*12000,need=(1800+a.rating*70)*8+(400+a.rating*16)*18+(1500+a.rating*35)*3;if(val>=need*.92*(1-S.p.prestige/500)){a.status='Plantel';a.salary=o;S.p.roster.push(a);S.market=S.market.filter(x=>x.id!==a.id);S.news.push(a.name+' se incorporó al conjunto.');U.modal=null;save();render();alert('Oferta aceptada.')}else if(val>=need*.7){alert('El artista pide una mejora de la oferta.');}else{alert('Oferta rechazada y negociación cancelada.');U.modal=null;render()}})}
function endWeek(){if(!Object.keys(S.p.plan).length&&!confirm('Semana sin actividades. ¿Continuar?'))return;let practiced={},income=0;RUB.forEach(r=>practiced[r]=0);Object.values(S.p.plan).forEach(e=>{if(e.type==='festival'){income+=e.pay;S.p.pop=cl(S.p.pop+e.pop,0,100)}else{let rep={};e.parts.forEach(p=>{if(p==='Ensayo completo'){RUB.slice(0,4).forEach(r=>{S.p.rub[r]=cl(S.p.rub[r]+.45,1,99);practiced[r]++});S.p.rub['Rodaje general']=cl(S.p.rub['Rodaje general']+1.2,1,99)}else{rep[p]=(rep[p]||0)+1;let mult=rep[p]===1?1:rep[p]===2?.72:.5;S.p.rub[p]=cl(S.p.rub[p]+1.4*mult,1,99);practiced[p]++}});if(S.cal.m>=7)income+=rand(2500,11000)}});RUB.slice(0,5).forEach(r=>{if(!practiced[r]){S.p.neg[r]=(S.p.neg[r]||0)+1;if(S.p.neg[r]>=2)S.p.rub[r]=cl(S.p.rub[r]-.35,1,99)}else S.p.neg[r]=0});let salaries=S.p.roster.reduce((x,a)=>x+(a.salary?.monthly||0)/4.33,0);S.p.money+=income-salaries;S.news.push(`Semana cerrada: ${income-salaries>=0?'+':''}${money(income-salaries)} · espectáculo ${rating()}/100.`);S.p.plan={};if(S.cal.m===9&&S.cal.w===4)S.done=true;else{S.cal.g++;S.cal.w++;if(S.cal.w>4){S.cal.w=1;S.cal.m++}}save();render()}
const oldGame=game;game=function(){oldGame();modalBind()};render();
</script></body></html>
